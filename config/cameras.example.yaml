# Multi-camera configuration.
#
# Point CAMERAS_CONFIG at this file (see .env.example) to run more than one
# camera. Each camera runs its own capture thread and its own VideoPipeline
# (own track registry, own fusion/temporal state, own crowd baseline) so
# cameras never interfere with one another; only cross-camera re-identification
# candidate-linking is shared across all of them.
#
# `source` accepts:
#   - a webcam index, e.g. "0", "1"
#   - an RTSP/IP camera URL, e.g. "rtsp://user:pass@192.168.1.50:554/stream1"
#   - a video file path, for offline testing/replay
#
# `zones` are optional restricted-area polygons in frame pixel coordinates.
# A human detected inside a restricted zone during its active_hours window is
# classified as a robbery/intrusion incident (see app/services/incidents.py).
# Leave zones empty ([]) for a camera with no restricted areas.

cameras:
  - camera_id: CAM-01
    name: "Front Entrance"
    source: "0"
    group: "perimeter"
    enabled: true
    target_fps: 15
    zones: []

  - camera_id: CAM-02
    name: "Loading Dock"
    source: "rtsp://192.168.1.51:554/stream1"
    group: "perimeter"
    enabled: false   # disable cameras you have not wired up yet rather than deleting them
    target_fps: 10
    zones:
      - name: "restricted-dock-area"
        restricted: true
        active_hours: ["22:00", "06:00"]   # overnight only; omit for 24/7
        polygon: [[100, 200], [500, 200], [500, 480], [100, 480]]

  - camera_id: CAM-03
    name: "Parking Lot"
    source: "rtsp://192.168.1.52:554/stream1"
    group: "parking"
    enabled: false
    target_fps: 10
    zones: []
