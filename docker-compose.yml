services:
  postgres:
    image: postgres:16
    container_name: ivi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ivi
      POSTGRES_USER: ivi
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - ivi_pgdata:/var/lib/postgresql/data

volumes:
  ivi_pgdata:
